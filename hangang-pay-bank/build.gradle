plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.sonarqube' version '6.2.0.5505'
	id 'jacoco'
}

sonar {
	properties {
		property 'sonar.projectKey', 'Fisa-Family_hangang-pay'
		property 'sonar.organization', 'fisa-family'
		property 'sonar.host.url', 'https://sonarcloud.io'
		property 'sonar.sources', 'src/main/java'
		property 'sonar.tests', 'src/test/java'
		property 'sonar.java.binaries', 'build/classes/java/main'
		property 'sonar.coverage.jacoco.xmlReportPaths', 'build/reports/jacoco/test/jacocoTestReport.xml'
	}
}

group = 'family.fisa'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'com.h2database:h2'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	implementation 'org.web3j:core:4.12.3'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

	runtimeOnly 'io.micrometer:micrometer-registry-prometheus' // 메트릭 노출: /actuator/prometheus → Alloy 스크랩
	implementation 'io.sentry:sentry-spring-boot-starter-jakarta:8.28.0' // Sentry (에러 추적 + 성능 트레이싱). SENTRY_DSN 미설정 시 비활성
	implementation 'io.sentry:sentry-logback:8.28.0'
	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	testImplementation 'org.springframework.amqp:spring-rabbit-test'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
	}
}

jar {
	enabled = false
}
