spring:
  profiles:
    active: local
  application:
    name: hangang-pay-bank
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: 8081
  tomcat:
    mbeanregistry:
      enabled: true # tomcat_threads_* 메트릭 노출 (스레드 포화 관측)

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

# 로그 상관관계: 로컬/dev 콘솔 패턴에 MDC requestId 노출
# prod의 ECS 구조화 로깅에서는 MDC가 JSON 필드로 자동 포함되므로 이 패턴은 무시된다.
logging:
  pattern:
    correlation: "[%X{requestId:-}] "

# Sentry (에러 추적 + 성능 트레이싱)
# DSN은 환경변수로 주입. 미설정 시(local/dev) Sentry 비활성
sentry:
  dsn: ${SENTRY_DSN:}
  send-default-pii: false # 개인정보 비전송
  logging:
    minimum-event-level: warn # WARN 이상을 Sentry 이벤트로 전송
    minimum-breadcrumb-level: info

wallet:
  key-cipher:
    secret: ${WALLET_KEY_CIPHER_SECRET:dev-secret-please-change-in-production}

blockchain:
  private-network:
    chain-id: 1337
  sync:
    shard-count: 4
    queue-prefix: blockchain-sync

mq:
  provider: rabbit

outbox:
  publisher:
    delay-ms: 5000ms
