      - --genesis-file=/etc/besu/genesis.json
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-cors-origins=*
      - --rpc-http-api=ETH,NET,QBFT,WEB3,MINER,ADMIN
      - --rpc-ws-enabled=true
      - --rpc-ws-host=0.0.0.0
      - --rpc-ws-port=8546
      - --p2p-port=30303
      - --p2p-host=${NODE2_IP}
      - --host-allowlist=*
      - --min-gas-price=0
      - --bootnodes=enode://7fa5133d55c65f610f8a75a69a6dcd35e5a3bf26b23c070e4ce43e578daea0e2689b1b1938a44c32bd1cd71b143b420a007052ddb5048428ddaf99a21e75632f@${NODE1_IP}:30303
      - --logging=INFO
      - --bonsai-historical-block-limit=100000
