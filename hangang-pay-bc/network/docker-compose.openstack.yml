services:
  rpc-lb:
    image: nginx:alpine
    container_name: besu-rpc-lb
    command:
      - /bin/sh
      - -c
      - >
        export RPC_FAIL_TIMEOUT="$${RPC_FAIL_TIMEOUT:-5s}"
        RPC_KEEPALIVE="$${RPC_KEEPALIVE:-32}"
        RPC_CONNECT_TIMEOUT="$${RPC_CONNECT_TIMEOUT:-2s}"
        RPC_SEND_TIMEOUT="$${RPC_SEND_TIMEOUT:-30s}"
        RPC_READ_TIMEOUT="$${RPC_READ_TIMEOUT:-30s}"
        RPC_NEXT_UPSTREAM_TRIES="$${RPC_NEXT_UPSTREAM_TRIES:-4}";
        envsubst '$$NODE1_IP $$NODE2_IP $$NODE3_IP $$NODE4_IP $$RPC_FAIL_TIMEOUT $$RPC_KEEPALIVE $$RPC_CONNECT_TIMEOUT $$RPC_SEND_TIMEOUT $$RPC_READ_TIMEOUT $$RPC_NEXT_UPSTREAM_TRIES'
        < /etc/nginx/templates/default.conf.template
        > /etc/nginx/conf.d/default.conf
        && exec nginx -g 'daemon off;'
    ports:
      - "${RPC_LB_HOST_PORT:-18545}:8545"
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
    environment:
      NODE1_IP: ${NODE1_IP}
      NODE2_IP: ${NODE2_IP}
      NODE3_IP: ${NODE3_IP}
      NODE4_IP: ${NODE4_IP}
      RPC_FAIL_TIMEOUT: ${RPC_FAIL_TIMEOUT:-5s}
      RPC_KEEPALIVE: ${RPC_KEEPALIVE:-32}
      RPC_CONNECT_TIMEOUT: ${RPC_CONNECT_TIMEOUT:-2s}
      RPC_SEND_TIMEOUT: ${RPC_SEND_TIMEOUT:-30s}
      RPC_READ_TIMEOUT: ${RPC_READ_TIMEOUT:-30s}
      RPC_NEXT_UPSTREAM_TRIES: ${RPC_NEXT_UPSTREAM_TRIES:-4}
      
  node1:
    image: besu-jdk21:26.4.0
    container_name: besu-node1
    restart: unless-stopped
    environment:
      BESU_OPTS: "-XX:TieredStopAtLevel=1 -Xshare:off"   # qemu(KVM 없음) JIT SIGSEGV 회피: C2 off + CDS off
    volumes:
      - ./node-1/data:/var/lib/besu
      - ./genesis.json:/etc/besu/genesis.json
    ports:
      - "8545:8545"
      - "8546:8546"
      - "30303:30303/tcp"
      - "30303:30303/udp"
    command:
      - --data-path=/var/lib/besu
      - --genesis-file=/etc/besu/genesis.json
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-cors-origins=*
      - --rpc-http-api=ETH,NET,QBFT,WEB3,MINER,ADMIN
      - --rpc-ws-enabled=true
      - --rpc-ws-host=0.0.0.0
      - --rpc-ws-port=8546
      - --p2p-port=30303
      - --p2p-host=${NODE1_IP}
      - --host-allowlist=*
      - --min-gas-price=0
      - --logging=ERROR
      - --bonsai-historical-block-limit=100000
      - --bonsai-trie-logs-pruning-window-size=150000
      - --rpc-http-max-active-connections=200

  node2:
    image: besu-jdk21:26.4.0
    container_name: besu-node2
