spring:
  application:
    name: hangang-pay

# Tomcat 스레드 메트릭(tomcat_threads_*) 노출 — Micrometer가 MBean 기반으로 수집(스레드 포화 관측)
server:
  tomcat:
    mbeanregistry:
      enabled: true

# Swagger (SpringDoc) : /swagger-ui/index.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method # Http 메서드 기반 정렬
    tags-sorter: alpha # tag 기반 정렬
    filter: true # 검색
    try-it-out-enabled: true # try it out 버튼 띄우기
    display-request-duration: true # 요청 소요 시간 표시
  api-docs:
    path: /api-docs


# 로그 상관관계: 로컬/dev 콘솔 패턴에 MDC requestId 노출
# prod의 ECS 구조화 로깅에서는 MDC가 JSON 필드로 자동 포함되므로 이 패턴은 무시된다.
logging:
  pattern:
    correlation: "[%X{requestId:-}] "

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    distribution:
      # http.server.requests 히스토그램 버킷 노출 -> Grafana p95/p99(histogram_quantile) 계산 가능
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 10s
  metrics:
    distribution:
      # http.server.requests 히스토그램 버킷(_bucket) 노출 -> Grafana p95/p99(histogram_quantile) 계산 가능
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 10s

# Sentry (에러 추적 + 성능 트레이싱)
# DSN은 환경변수로 주입. 미설정 시(local/dev) Sentry 비활성
sentry:
  dsn: ${SENTRY_DSN:}
  send-default-pii: false # 개인정보 비전송
  logging:
    minimum-event-level: warn # WARN 이상을 Sentry 이벤트로 전송
    minimum-breadcrumb-level: info

# CORS : CorsConfig.java에서 읽어서 목록에 채운다.
app:
  cors:
    allowed-origins: [] # 프로필 설정이 누락됐을 때 빈 목록으로 Fallback

blockchain:
  private-network:
    chain-id: 1337 # 트랜잭션 서명 시 사용하는 private blockchain 네트워크 식별자

wallet:
  key-cipher:
    secret: ${WALLET_KEY_CIPHER_SECRET:hangang-pay-local-wallet-key-cipher-secret}
