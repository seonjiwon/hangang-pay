name: BC Format Check

# 수동 실행 전용(자동 트리거 없음 → "유효하지 않은 워크플로" 실패 방지).
# 실제 포맷 CI를 켜려면 pull_request 트리거(paths: hangang-pay-bc/**)로 확장.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bc-format:
    name: BC Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: hangang-pay-bc/blockchain/package-lock.json

      - name: Install dependencies
        working-directory: hangang-pay-bc/blockchain
        run: npm ci

      - name: Prettier check
        working-directory: hangang-pay-bc/blockchain
        run: npm run format:check
