# ============================================================
# 한강페이 BE 배포 (CD) — ECR 이미지 빌드 → SSM으로 EC2 pull+restart
# 수동 실행(workflow_dispatch). CI(테스트/빌드 검증)는 be-ci.yml이 dev에서 담당.
# 사전 준비:
#   - GitHub OIDC provider
#   - BE_AWS_ROLE_ARN 역할: ECR push(예: AmazonEC2ContainerRegistryPowerUser)
#       + ssm:SendCommand/GetCommandInvocation
#   - hp-be 인스턴스 역할 hp-ec2-ssm-role: AmazonSSMManagedInstanceCore
#       + ECR pull(AmazonEC2ContainerRegistryReadOnly)
#   - hp-be에 aws CLI 설치(ECR 로그인용) + ECR 레포 hangang-pay-be 생성
# ============================================================
name: BE CD

on:
  workflow_dispatch:
  push:
    branches: [prod]
    paths:
      - "hangang-pay-be/**"
      - ".github/workflows/be-cd-prod.yml"

# OIDC로 AWS 역할 assume → 저장된 액세스키 0개
permissions:
  id-token: write
  contents: read

# 동시 배포 방지: 한 번에 하나만
concurrency:
  group: be-cd
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPO: hangang-pay-be

jobs:
  # ----------------------------------------------------------
  # [1] 테스트 — 배포 전 마지막 안전망. (be-ci와 중복이면 이 job 삭제 가능)
  # ----------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hangang-pay-be
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
      - run: chmod +x ./gradlew
      - run: ./gradlew test --no-daemon

  # ----------------------------------------------------------
  # [2] 이미지 빌드 → ECR push (latest + commit sha)
  # ----------------------------------------------------------
  build-push:
    name: Build & Push to ECR
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.BE_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        uses: docker/build-push-action@v7
        with:
          context: hangang-pay-be
          file: hangang-pay-be/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}

      # 배포 job에 넘길 sha 태그 이미지 URI
      - name: Export image URI
        id: meta
        run: echo "image=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  # ----------------------------------------------------------
  # [3] SSM으로 EC2에서 ECR 로그인 → 새 이미지 pull + 컨테이너 교체 (인바운드 SSH 불필요)
  # ----------------------------------------------------------
  deploy:
    name: Deploy via SSM
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.BE_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Send deploy command via SSM
        run: |
          set -euo pipefail
          IMAGE="${{ needs.build-push.outputs.image }}"
          INSTANCE="${{ vars.BE_INSTANCE_ID }}"
          REGION="${{ env.AWS_REGION }}"
          REGISTRY="${IMAGE%%/*}"   # <acct>.dkr.ecr.<region>.amazonaws.com

          # EC2에서 실행할 스크립트. base64로 감싸 SSM --parameters 따옴표 이슈를 피한다.
          # ${IMAGE}/${REGION}/${REGISTRY}만 러너에서 치환, remote 셸 구문(\$(...))은 이스케이프.
          SCRIPT="set -e
          aws ecr get-login-password --region ${REGION} | docker login --username AWS --password-stdin ${REGISTRY}
          cd /home/ubuntu/hangang-pay/hangang-pay-be/deploy
          export APP_IMAGE=${IMAGE}
          docker compose pull
          docker compose up -d
          docker image prune -af --filter 'until=48h' || true
          for i in \$(seq 1 30); do curl -fsS http://127.0.0.1:8080/actuator/health && exit 0; sleep 5; done
          echo 'health check timeout'; docker compose logs --tail 100 app; exit 1"

          B64=$(printf '%s' "$SCRIPT" | base64 -w0)

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy be ${{ github.sha }}" \
            --parameters "commands=[\"echo $B64 | base64 -d | bash\"]" \
            --query "Command.CommandId" --output text)
          echo "SSM CommandId: $CMD_ID"

          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE" || true

          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" --query Status --output text)
          echo "----- STDOUT -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" --query StandardOutputContent --output text || true
          echo "----- STDERR -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" --query StandardErrorContent --output text || true
          echo "Status: $STATUS"
          [ "$STATUS" = "Success" ]
