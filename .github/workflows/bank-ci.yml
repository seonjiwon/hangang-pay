name: Bank CI

on:
  push:
    branches: [dev, test]
    paths:
      - "hangang-pay-bank/**"
      - ".github/workflows/bank-ci.yml"
  pull_request:
    branches: [dev, test]
    paths:
      - "hangang-pay-bank/**"
      - ".github/workflows/bank-ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hangang-pay-bank

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Test
        run: ./gradlew test --no-daemon

      - name: Analyze with SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --no-daemon

      - name: Build jar
        run: ./gradlew bootJar --no-daemon

  docker:
    name: Docker Hub
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'
    environment: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/hangang-pay-bank
          tags: |
            type=raw,value=test-latest
            type=sha,prefix=test-

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: hangang-pay-bank
          file: hangang-pay-bank/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to on-prem Bank
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'
    environment: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.ONPREM_BASTION_SSH_KEY }}" > ~/.ssh/bastion_key
          printf '%s\n' "${{ secrets.ONPREM_INSTANCE_SSH_KEY }}" > ~/.ssh/team01.pem
          chmod 600 ~/.ssh/bastion_key ~/.ssh/team01.pem

          cat > ~/.ssh/config <<EOF
          Host onprem-bastion
            HostName ${{ secrets.ONPREM_BASTION_HOST }}
            User ${{ secrets.ONPREM_BASTION_USER }}
            Port ${{ secrets.ONPREM_BASTION_PORT }}
            IdentityFile ~/.ssh/bastion_key
            StrictHostKeyChecking no

          Host onprem-bank
            HostName ${{ secrets.ONPREM_BANK_HOST }}
            User ubuntu
            IdentityFile ~/.ssh/team01.pem
            ProxyJump onprem-bastion
            StrictHostKeyChecking no
          EOF

      - name: Upload compose deployment files
        run: |
          ssh onprem-bank 'rm -rf /tmp/hangang-pay-bank-deploy && mkdir -p /tmp/hangang-pay-bank-deploy'
          scp hangang-pay-bank/deploy/docker-compose.yml onprem-bank:/tmp/hangang-pay-bank-deploy/docker-compose.yml
          scp -r hangang-pay-bank/deploy/alloy onprem-bank:/tmp/hangang-pay-bank-deploy/alloy

      - name: Pull image and restart compose stack
        run: |
          ssh onprem-bank 'bash -s' <<'EOF'
          set -Eeuo pipefail

          APP_DIR=/opt/hangang-pay-bank

          if ! sudo docker compose version >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y docker-compose-plugin
          fi

          echo '${{ secrets.DOCKERHUB_TOKEN }}' | sudo docker login \
            --username '${{ secrets.DOCKERHUB_USERNAME }}' \
            --password-stdin

          sudo docker pull '${{ secrets.DOCKERHUB_USERNAME }}/hangang-pay-bank:test-latest'
          sudo docker pull grafana/alloy:latest

          sudo mkdir -p "$APP_DIR/alloy"
          sudo cp /tmp/hangang-pay-bank-deploy/docker-compose.yml "$APP_DIR/docker-compose.yml"
          sudo cp -R /tmp/hangang-pay-bank-deploy/alloy/. "$APP_DIR/alloy/"

          if [ -f "$APP_DIR/.env" ]; then
            (cd "$APP_DIR" && sudo docker compose -f docker-compose.yml down) || true
          fi

          sudo docker rm -f hangang-pay-bank bank-app bank-alloy 2>/dev/null || true

          sudo tee "$APP_DIR/.env" >/dev/null <<'ENV'
          APP_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/hangang-pay-bank:test-latest
          SPRING_PROFILES_ACTIVE=onprem-test
          DB_URL=${{ secrets.ONPREM_BANK_DB_URL }}
          DB_USERNAME=${{ secrets.ONPREM_BANK_DB_USERNAME }}
          DB_PASSWORD=${{ secrets.ONPREM_BANK_DB_PASSWORD }}
          WALLET_KEY_CIPHER_SECRET=${{ secrets.ONPREM_BANK_WALLET_KEY_CIPHER_SECRET }}
          SENTRY_DSN=${{ secrets.ONPREM_BANK_SENTRY_DSN }}
          SENTRY_RELEASE=${{ github.sha }}
          GRAFANA_PROM_URL=${{ secrets.ONPREM_BANK_GRAFANA_PROM_URL }}
          GRAFANA_PROM_USER=${{ secrets.ONPREM_BANK_GRAFANA_PROM_USER }}
          GRAFANA_PROM_PASSWORD=${{ secrets.ONPREM_BANK_GRAFANA_PROM_PASSWORD }}
          GRAFANA_LOKI_URL=${{ secrets.ONPREM_BANK_GRAFANA_LOKI_URL }}
          GRAFANA_LOKI_USER=${{ secrets.ONPREM_BANK_GRAFANA_LOKI_USER }}
          GRAFANA_LOKI_PASSWORD=${{ secrets.ONPREM_BANK_GRAFANA_LOKI_PASSWORD }}
          RABBITMQ_HOST=${{ secrets.ONPREM_BANK_RABBITMQ_HOST }}
          RABBITMQ_PORT=${{ secrets.ONPREM_BANK_RABBITMQ_PORT }}
          RABBITMQ_USERNAME=${{ secrets.ONPREM_BANK_RABBITMQ_USERNAME }}
          RABBITMQ_PASSWORD=${{ secrets.ONPREM_BANK_RABBITMQ_PASSWORD }}
          ALLOY_SERVICE=hangang-pay-bank
          DEPLOY_TARGET=onprem
          ALLOY_ENV=prod
          ALLOY_COLOR=
          APP_SCRAPE_TARGET=app:8081
          APP_CONTAINER_NAME=bank-app
          ENV

          printf 'INSTANCE_ID=%s\n' "$(hostname)" | sudo tee -a "$APP_DIR/.env" >/dev/null
          sudo chmod 600 "$APP_DIR/.env"

          BOK_RPC_ENDPOINT='${{ secrets.ONPREM_BANK_BOK_RPC_ENDPOINT }}'
          WR_RPC_ENDPOINT='${{ secrets.ONPREM_BANK_WR_RPC_ENDPOINT }}'
          SH_RPC_ENDPOINT='${{ secrets.ONPREM_BANK_SH_RPC_ENDPOINT }}'
          HN_RPC_ENDPOINT='${{ secrets.ONPREM_BANK_HN_RPC_ENDPOINT }}'

          if [ -n "$BOK_RPC_ENDPOINT" ]; then printf 'BOK_RPC_ENDPOINT=%s\n' "$BOK_RPC_ENDPOINT" | sudo tee -a "$APP_DIR/.env" >/dev/null; fi
          if [ -n "$WR_RPC_ENDPOINT" ]; then printf 'WR_RPC_ENDPOINT=%s\n' "$WR_RPC_ENDPOINT" | sudo tee -a "$APP_DIR/.env" >/dev/null; fi
          if [ -n "$SH_RPC_ENDPOINT" ]; then printf 'SH_RPC_ENDPOINT=%s\n' "$SH_RPC_ENDPOINT" | sudo tee -a "$APP_DIR/.env" >/dev/null; fi
          if [ -n "$HN_RPC_ENDPOINT" ]; then printf 'HN_RPC_ENDPOINT=%s\n' "$HN_RPC_ENDPOINT" | sudo tee -a "$APP_DIR/.env" >/dev/null; fi

          cd "$APP_DIR"
          sudo docker compose -f docker-compose.yml up -d --remove-orphans

          HEALTH_MAX_ATTEMPTS=30
          HEALTH_RETRY_SECONDS=5
          healthy=false

          echo "Waiting for actuator health check..."
          for attempt in $(seq 1 "$HEALTH_MAX_ATTEMPTS"); do
            if curl -fsS http://127.0.0.1:8081/actuator/health > /tmp/hangang-pay-bank-health.json; then
              cat /tmp/hangang-pay-bank-health.json
              echo
              echo "hangang-pay-bank is healthy."
              healthy=true
              break
            fi

            if ! sudo docker inspect -f '{{.State.Running}}' bank-app | grep -q true; then
              echo "bank-app container stopped during startup."
              sudo docker compose -f docker-compose.yml logs --tail 200 app alloy
              exit 1
            fi

            echo "Health check attempt ${attempt}/${HEALTH_MAX_ATTEMPTS} failed. Retrying..."
            sleep "$HEALTH_RETRY_SECONDS"
          done

          if [ "$healthy" = "true" ]; then
            sudo docker ps --filter "name=bank-"
            exit 0
          fi

          echo "hangang-pay-bank health check timed out."
          sudo docker ps --filter "name=bank-"
          sudo docker compose -f docker-compose.yml logs --tail 200 app alloy
          exit 1
          EOF
