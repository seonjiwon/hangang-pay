name: BE CI

# BE 코드나 BE CI 워크플로우가 바뀔 때만 실행. dev 브랜치 push/PR을 검증(테스트+빌드)한다.
on:
  push:
    branches: [dev]
    paths:
      - "hangang-pay-be/**"
      - ".github/workflows/be-ci.yml"
  pull_request:
    branches: [dev]
    paths:
      - "hangang-pay-be/**"
      - ".github/workflows/be-ci.yml"

permissions:
  contents: read

jobs:
  # Gradle 단위 테스트 + jar 빌드.
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hangang-pay-be
    services:
      # 테스트 프로필에서 Redis 의존성이 필요하므로 GitHub Actions 서비스 컨테이너로 띄운다.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Test
        run: ./gradlew test --no-daemon

      - name: Build jar
        run: ./gradlew bootJar --no-daemon
