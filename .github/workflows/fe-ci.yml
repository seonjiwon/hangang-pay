name: FE CI

# FE 코드나 이 워크플로 변경 시 dev 브랜치 push/PR을 검증(포맷/린트/테스트/빌드)한다.
on:
  push:
    branches: [dev]
    paths:
      - "hangang-pay-fe/**"
      - ".github/workflows/fe-ci.yml"
  pull_request:
    branches: [dev]
    paths:
      - "hangang-pay-fe/**"
      - ".github/workflows/fe-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Check, Test, and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hangang-pay-fe

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: hangang-pay-fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check format and lint
        run: npm run check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
